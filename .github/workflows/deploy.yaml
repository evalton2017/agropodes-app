name: deploy-agroprodes-app

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, edited]
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # Otimização: Cache do Docker para acelerar builds subsequentes
      - name: Set up Docker Buildx
        uses: docker/setup-qemu-action@v3
        with:
          run: |
            echo "Buildx pronto"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/agroprodes-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build

    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2214
          script: |
            # Acessa a pasta onde está o docker-compose-app.yml na VPS
            cd ~/develop || mkdir -p ~/develop && cd ~/develop

            # Autentica no Docker Hub usando Token seguro
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Garante a existência da rede do Traefik
            docker network inspect traefik-network >/dev/null 2>&1 || docker network create traefik-network

            # Pull da imagem nova
            docker compose -f docker-compose-app.yml pull agroprods-web

            # Sobe a aplicação atualizada sem derrubar o Traefik (Zero Downtime relativo)
            docker compose -f docker-compose-app.yml up -d --force-recreate agroprods-web
