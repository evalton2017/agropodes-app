name: deploy-agroprodes-app

on:
  push:
    branches:
      - develop
    pull request:
      types: [opened, synchronize, edited]
      branches:
        - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: login docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/agroprodes-app:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deploy vps
        uses: actions/checkout@v4

      - name: copiando imagem para vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Garante que o diretório existe (o -p cria os pais se necessário)
            mkdir -p ~/homolog

            # Autentica a VPS no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Pull latest image and restart container
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/agroprodes-app:latest

            # Para e remove o container se ele existir, sem travar se não existir
            docker ps -aqf "name=agroprods-frontend" | xargs -r docker rm -f

            # Sobe o novo container
            #docker run -d -p 80:4200  --name agroprodes-app ${{ secrets.DOCKER_HUB_USERNAME }}/agroprodes-app:latest

            # 1. Garanta que a rede externa existe (se não existir, o Traefik falha)
            docker network inspect traefik-network >/dev/null 2>&1 || docker network create traefik-network

            # 2. compose run sobe o traefik e api
            docker compose -f docker-compose-deploy.yml up -d


