<div class="home-container">

  @if (!isAutenticado()) {
    <home-publico />
  }
  @else if (possuiRole('USER_PRODUTOR')) {
    <main class="content">
      <home-logado />
    </main>
  }
  @else if (possuiRole('USER_ANALISTA')) {
    <main class="content">
      <app-dashboard-analista />
    </main>
  }
  @else {
    <main class="content" style="padding: 32px; text-align: center;">
      <mat-card appearance="outlined" style="padding: 24px; max-width: 400px; margin: 0 auto;">
        <mat-card-title color="warn">Acesso Restrito</mat-card-title>
        <mat-card-content style="margin-top: 16px;">
          Seu usuário não possui as permissões necessárias para visualizar este painel.
        </mat-card-content>
      </mat-card>
    </main>
  }

</div>
