<div class="vmg-caderno-page-container">

  <!-- 1. CARDS DE SELEÇÃO DE GLEBAS -->
  <div class="vmg-secao-glebas">
    <app-dashboard-produtor-gleba-card
      (glebaSelecionadaChange)="onGlebaSelecionada($event)">
    </app-dashboard-produtor-gleba-card>
  </div>

  @if (glebaSelecionadaId(); as idGleba) {

    <!-- 2. COMPONENTE DE SELEÇÃO DE SAFRA -->
    <div class="vmg-secao-safras">
      <app-seletor-safras
        [idGleba]="idGleba"
        (safraSelecionada)="onSafraSelecionada($event)">
      </app-seletor-safras>
    </div>

    <!-- 3. DETALHES DO CADERNO DE CAMPO -->
    <div class="vmg-secao-caderno-main">
      @if (safraSelecionada()) {
        <app-caderno-campo-detalhado
          [glebaId]="idGleba"
          [safra]="safraSelecionada()!"
          [caderno]="cadernoAtivo()">
        </app-caderno-campo-detalhado>
      } @else {
        <div class="vmg-empty-state-sub">
          <p>Por favor, selecione uma safra acima para carregar o Caderno de Campo.</p>
        </div>
      }
    </div>

  } @else {
    <!-- ESTADO INICIAL VAZIO -->
    <div class="vmg-empty-state">
      <mat-icon class="icon-hand">touch_app</mat-icon>
      <h3>Nenhuma Gleba Selecionada</h3>
      <p>Selecione uma gleba acima para visualizar o Caderno de Campo do Produtor.</p>
    </div>
  }

</div>
