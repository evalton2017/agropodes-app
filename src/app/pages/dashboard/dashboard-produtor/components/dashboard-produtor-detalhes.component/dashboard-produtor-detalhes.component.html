<div class="vmg-dashboard-row-two">

  <!-- Componente 1: Mapa da Situação Ambiental -->
  <div class="vmg-widget-col col-mapa relative">
    @if (carregando()) {
      <div class="vmg-loading-overlay">
        <mat-spinner diameter="36"></mat-spinner>
        <span>Carregando dados geoespaciais...</span>
      </div>
    }

    <app-dashboard-produtor-mapa
      [idGleba]="idGleba"
      [safra]="safra || filtroService.filtrosAtivos().safra">
    </app-dashboard-produtor-mapa>
  </div>

  <!-- Componente 2: Tabela de Resumo de Conformidade -->
  <div class="vmg-widget-col col-tabela">
    @if (carregando()) {
      <div class="vmg-loading-card">
        <mat-spinner diameter="36"></mat-spinner>
        <span>Consolidando conformidade...</span>
      </div>
    } @else if (dadosTabela()) {
      <app-dashboard-produtor-tabela [conformidade]="dadosTabela()!"></app-dashboard-produtor-tabela>
    }
  </div>

  <!-- Componente 3: Status das Glebas e Atividades -->
  <div class="vmg-widget-col col-status">
    @if (carregando()) {
      <div class="vmg-loading-card">
        <mat-spinner diameter="36"></mat-spinner>
        <span>Carregando atividades...</span>
      </div>
    } @else if (dadosStatusAtividades()) {
      <app-dashboard-produtor-status-atividades [dados]="dadosStatusAtividades()!"></app-dashboard-produtor-status-atividades>
    }
  </div>

</div>
