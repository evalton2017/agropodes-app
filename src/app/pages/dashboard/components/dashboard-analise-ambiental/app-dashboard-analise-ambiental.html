<div class="ia-card">
  @if (carregando()) {
    <div class="ia-loading-overlay">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
  }

  <h3 class="ia-card-title">Análise Ambiental (Conformidade)</h3>

  @if (dados(); as d) {
    <div class="ia-card-body flex-row-center">

      <!-- Donut Chart Dinâmico via CSS Conic Gradient -->
      <div class="ia-donut-wrapper" [ngStyle]="estiloDonutGradiente()">
        <div class="donut-inner-circle">
          <span class="ia-donut-value">{{ d.conforme_pct }}%</span>
          <span class="ia-donut-label">Conforme</span>
        </div>
      </div>

      <!-- Legenda Lateral Dinâmica -->
      <div class="ia-legend-list">
        <div class="legend-item">
          <span class="bullet bg-green"></span>Conforme
          <strong class="val">{{ d.conforme_pct }}%</strong>
        </div>
        <div class="legend-item">
          <span class="bullet bg-amber"></span>Atenção
          <strong class="val">{{ d.atencao_pct }}%</strong>
        </div>
        <div class="legend-item">
          <span class="bullet bg-rose"></span>Não Conf.
          <strong class="val">{{ d.nao_conforme_pct }}%</strong>
        </div>
      </div>

    </div>
  } @else if (!carregando()) {
    <div class="empty-state">
      <span>Nenhum dado cadastrado para a safra informada.</span>
    </div>
  }

  <div class="ia-card-footer">
    <button class="ia-footer-link">Ver detalhes ambientais</button>
  </div>
</div>
