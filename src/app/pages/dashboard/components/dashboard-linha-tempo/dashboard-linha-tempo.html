<section class="dashboard-card">
  @if (carregando()) {
    <div class="ia-loading-overlay"><mat-spinner diameter="30"></mat-spinner></div>
  }

  <div class="card-header">
    <h3>Linha do Tempo de Análises</h3>
    <a class="header-link">Ver todas</a>
  </div>

  <div class="timeline-container">
    @for (passo of passosTimeline(); track passo.nome) {
      <div class="timeline-item">
        <div class="timeline-left">
          <mat-icon [ngClass]="passo.status">{{ passo.icone }}</mat-icon>
          <span class="timeline-label">{{ passo.nome }}</span>
        </div>
        <span class="timeline-count" [ngClass]="passo.status">{{ passo.count }}</span>
      </div>
    }
  </div>
</section>
