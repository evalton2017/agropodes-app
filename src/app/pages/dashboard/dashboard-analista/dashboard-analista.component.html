<div class="dashboard-main-wrapper dashboard-dark-theme min-h-screen box-border">

  <!-- 🏷️ CABEÇALHO DO DASHBOARD E BARRA DE SAFRAS -->
  <div class="header-dashboard-row flex flex-col w-full">
    <div class="header-title-block flex flex-col">
      <h1 class="text-2xl font-extrabold text-slate-100 m-0 tracking-tight">
        Dashboard de Monitoramento & Validação VMG
      </h1>
      <span class="text-sm font-medium text-slate-400 mt-1">
        Visão geral do monitoramento e análises gerados por IA
      </span>
    </div>

    <!-- 🟢 BARRAS DE SAFRAS COM MARGEM INFERIOR DE SEPARAÇÃO -->
    <div class="safra-pills-container">
      @for (safra of listaSafras; track safra; let idx = $index) {
        <button
          type="button"
          class="safra-btn-pill"
          [class.active-vigente]="filtroSafra === safra"
          (click)="selecionarSafra(safra)">

          @if (filtroSafra === safra) {
            <span class="safra-texto-vigente">{{ safra }}</span>
            <span class="badge-status-vigente">Vigente</span>
          } @else {
            <span class="icone-diamond" [class.diamond-laranja]="idx === 3" [class.diamond-verde]="idx !== 3">◆</span>
            <span class="safra-texto-concluida">{{ safra }}</span>
            <span class="badge-status-concluida">Concluída</span>
          }

        </button>
      }
    </div>
  </div>

  <!-- 📊 KPIS SUPERIORES COM ESPAÇAMENTO ISOLADO (DESCOLADO DOS BOTÕES) -->
  <div class="kpis-section-wrapper">
    <app-dashboard-kpis></app-dashboard-kpis>
  </div>

  <!-- 📈 GRÁFICOS EM GRID -->
  <div class="grid-container-graficos">
    <dashboard-grafico-estados></dashboard-grafico-estados>
    <dashboard-contratos-estado></dashboard-contratos-estado>
    <dashboard-grafico-culturas></dashboard-grafico-culturas>
    <app-dashboard-alertas></app-dashboard-alertas>
  </div>

  <!-- 🤖 WIDGETS DE IA -->
  <div class="ia-grid-container">
    <dashboard-analise-ambiental></dashboard-analise-ambiental>
    <dashboard-ia-classificacao></dashboard-ia-classificacao>
    <dashboard-ia-produtividade></dashboard-ia-produtividade>
  </div>

  <!-- 🌤️ CLIMA -->
  <div class="ia-clima w-full mt-4">
    <dashboard-ia-clima></dashboard-ia-clima>
  </div>

  <!-- 📋 TABELAS INFERIORES -->
  <div class="grid-container-tabelas">
    <dashboard-eventos></dashboard-eventos>
    <dashboard-atestados></dashboard-atestados>
  </div>

  <!-- 📌 LEGENDA DE STATUS -->
  <div class="bg-[#0b1a10] p-4 border border-[#183321] rounded-xl shadow-sm mt-6 flex flex-row flex-wrap items-center gap-6 text-sm text-slate-300 w-full">
    <span class="font-bold text-slate-100">Legenda de Status:</span>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
      <span class="whitespace-nowrap">Concluído</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
      <span class="whitespace-nowrap">Em andamento</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-slate-400"></span>
      <span class="whitespace-nowrap">Pendente</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-orange-500"></span>
      <span class="whitespace-nowrap">Alerta</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-orange-600"></span>
      <span class="whitespace-nowrap">Crítico</span>
    </div>

    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-red-600"></span>
      <span class="whitespace-nowrap">Não Conforme</span>
    </div>
  </div>

</div>
