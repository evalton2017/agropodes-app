<div class="dashboard-container">


  <div class="dashboard-container p-6 bg-gray-50 min-h-screen">

    <div class="dashboard-container p-6 bg-slate-50 min-h-screen box-border">

      <!-- 🏷️ NOVO TOPO E BARRA DE FILTROS ALINHADOS -->
      <div class="header-dashboard-row flex flex-row items-center justify-between w-full pb-6 flex-wrap gap-4">

        <!-- Lado Esquerdo: Título e Subtítulo -->
        <div class="header-title-block flex flex-col">
          <h1 class="text-2xl font-extrabold text-[#0f172a] m-0 tracking-tight">Dashboard teste com dados coletados de
            bases publicas</h1>
          <span
            class="text-sm font-medium text-slate-400 mt-1">Visão geral do monitoramento e análises gerados por IA</span>
        </div>

        <!-- Lado Direito: Filtros e Botão Atualizar -->
        <div class="filters-action-block flex flex-row items-center gap-3">

          <!-- Seletor de Safra -->
          <mat-form-field appearance="outline" class="w-40 !mb-0 dashboard-select-custom">
            <mat-label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Safra</mat-label>
            <mat-select [(value)]="filtroSafra">
              @for (safra of listaSafras; track safra) {
                <mat-option [value]="safra">{{ safra }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <!-- Seletor de Período -->
          <mat-form-field appearance="outline" class="w-60 !mb-0 dashboard-date-custom">
            <mat-label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Período</mat-label>
            <mat-date-range-input [formGroup]="rangeData" [rangePicker]="picker">
              <input matStartDate formControlName="inicio" placeholder="Início">
              <input matEndDate formControlName="fim" placeholder="Fim">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
          </mat-form-field>

          <!-- NOVO BOTÃO: Atualizar Estilo Outline Branco -->
          <button mat-stroked-button class="btn-atualizar-custom" (click)="aplicarFiltros()">
        <span class="flex items-center justify-center gap-2 text-slate-700 font-semibold text-sm">
          <mat-icon class="text-slate-500 !w-4 !h-4 text-base">refresh</mat-icon>
          Atualizar
        </span>
          </button>

        </div>
      </div>


      <div class="transition-opacity duration-300 space-y-6 w-full block">

        <div class="dashboard-container">

          <div class="space-y-6 w-full block">

            <div class="section">
              <app-dashboard-kpis></app-dashboard-kpis>
            </div>

            <div class="grid-container-graficos">

              <dashboard-grafico-estados></dashboard-grafico-estados>

              <dashboard-contratos-estado></dashboard-contratos-estado>

              <dashboard-grafico-culturas></dashboard-grafico-culturas>

              <app-dashboard-alertas></app-dashboard-alertas>
            </div>

            <div class="ia-grid-container">
              <dashboard-analise-ambiental></dashboard-analise-ambiental>

              <dashboard-ia-classificacao></dashboard-ia-classificacao>

              <dashboard-ia-produtividade></dashboard-ia-produtividade>

            </div>

            <div class="ia-clima">
              <dashboard-ia-clima></dashboard-ia-clima>
            </div>

            <div class="grid-container-tabelas">
              <dashboard-eventos></dashboard-eventos>

              <dashboard-atestados></dashboard-atestados>
            </div>

          </div>
        </div>


      </div>

      <div
        class="bg-white p-4 border border-gray-100 rounded-md shadow-sm mt-6 flex flex-row flex-wrap items-center gap-6 text-sm text-gray-600 w-full"
        style="display: flex !important; flex-direction: row !important; align-items: center !important; gap: 24px !important; margin-top: 5px;">
        <span class="font-semibold text-gray-700">Legenda de Status:</span>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #16a34a;"></span>
          <span class="whitespace-nowrap">Concluído</span>
        </div>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #d97706;"></span>
          <span class="whitespace-nowrap">Em andamento</span>
        </div>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #94a3b8;"></span>
          <span class="whitespace-nowrap">Pendente</span>
        </div>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #f97316;"></span>
          <span class="whitespace-nowrap">Alerta</span>
        </div>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #ea580c;"></span>
          <span class="whitespace-nowrap">Crítico</span>
        </div>

        <div class="flex items-center gap-2"
             style="display: flex !important; align-items: center !important; gap: 8px !important;">
          <span class="w-3 h-3 rounded-full"
                style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; background-color: #dc2626;"></span>
          <span class="whitespace-nowrap">Não Conforme</span>
        </div>
      </div>

    </div>


  </div>
</div>
