<div class="dashboard-main-wrapper dashboard-dark-theme min-h-screen box-border">

  <!-- 🏷️ CABEÇALHO DO DASHBOARD E BARRA DE SAFRAS -->
  <div class="header-dashboard-row flex flex-col w-full">
    <div class="header-title-block flex flex-col">
      <h1 class="text-2xl font-extrabold text-slate-100 m-0 tracking-tight">
        Dashboard de Monitoramento & Validação VMG
      </h1>
      <span class="text-sm font-medium text-slate-400 mt-1">
        Visão geral do monitoramento e análises gerados por IA
      </span>
    </div>

    <!-- BARRAS DE SAFRAS DINÂMICAS RECURSIVAS -->
    <div class="safra-pills-container mt-4 flex flex-wrap gap-2">
      @for (safra of listaSafras; track safra) {
        <button
          type="button"
          class="safra-btn-pill"
          [class.active-vigente]="filtroSafra === safra"
          (click)="selecionarSafra(safra)">

          @if (isSafraVigente(safra)) {
            <span class="icone-diamond diamond-verde">◆</span>
            <span class="safra-texto-vigente">{{ safra }}</span>
            <span class="badge-status-vigente">Vigente</span>
          } @else {
            <span class="icone-diamond diamond-laranja">◆</span>
            <span class="safra-texto-concluida">{{ safra }}</span>
            <span class="badge-status-concluida">Concluída</span>
          }

        </button>
      }
    </div>
  </div>

  <!-- 📊 KPIS SUPERIORES COM ESPAÇAMENTO ISOLADO (DESCOLADO DOS BOTÕES) -->
  <div class="kpis-section-wrapper mt-6">
    <app-dashboard-kpis></app-dashboard-kpis>
  </div>

  <!-- 📈 GRÁFICOS EM GRID -->
  <div class="grid-container-graficos mt-6">
    <dashboard-grafico-estados></dashboard-grafico-estados>
    <dashboard-contratos-estado></dashboard-contratos-estado>
    <dashboard-grafico-culturas></dashboard-grafico-culturas>
    <app-dashboard-alertas></app-dashboard-alertas>
  </div>

  <!-- 🤖 WIDGETS DE IA -->
  <div class="ia-grid-container mt-6">
    <dashboard-analise-ambiental></dashboard-analise-ambiental>
    <dashboard-ia-classificacao></dashboard-ia-classificacao>
    <dashboard-ia-produtividade></dashboard-ia-produtividade>
  </div>

  <!-- 🌤️ CLIMA -->
  <div class="ia-clima w-full mt-6">
    <dashboard-ia-clima></dashboard-ia-clima>
  </div>

  <!-- 📋 TABELAS INFERIORES -->
  <div class="grid-container-tabelas mt-6">
    <dashboard-eventos></dashboard-eventos>
    <dashboard-atestados></dashboard-atestados>
  </div>

  <!-- 📌 LEGENDA DE STATUS -->
  <div class="dashboard-legenda-status">
    <span class="legenda-titulo">Legenda de Status:</span>

    <div class="legenda-item">
      <span class="dot-status dot-concluido"></span>
      <span class="legenda-texto">Concluído</span>
    </div>

    <div class="legenda-item">
      <span class="dot-status dot-andamento"></span>
      <span class="legenda-texto">Em andamento</span>
    </div>

    <div class="legenda-item">
      <span class="dot-status dot-pendente"></span>
      <span class="legenda-texto">Pendente</span>
    </div>

    <div class="legenda-item">
      <span class="dot-status dot-alerta"></span>
      <span class="legenda-texto">Alerta</span>
    </div>

    <div class="legenda-item">
      <span class="dot-status dot-critico"></span>
      <span class="legenda-texto">Crítico</span>
    </div>

    <div class="legenda-item">
      <span class="dot-status dot-nao-conforme"></span>
      <span class="legenda-texto">Não Conforme</span>
    </div>
  </div>

</div>
