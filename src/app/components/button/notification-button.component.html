<button mat-icon-button [matMenuTriggerFor]="notifMenu" aria-label="Notificações">
  <mat-icon
    [matBadge]="notificationService.unreadCount()"
    [matBadgeHidden]="notificationService.unreadCount() === 0"
    matBadgeColor="warn">
    notifications
  </mat-icon>
</button>

<mat-menu #notifMenu="matMenu" xPosition="before" class="notification-dropdown-panel">
  <!-- CABEÇALHO DO MENU -->
  <div class="notif-header flex items-center justify-between p-2 border-b border-gray-700">
    <span class="font-bold text-xs text-gray-300">Notificações ({{ notificationService.unreadCount() }})</span>
    @if (notificationService.unreadCount() > 0) {
      <button mat-button class="btn-clear-all text-xs text-green-400" (click)="marcarTodasComoLidas()">
        Limpar todas
      </button>
    }
  </div>

  <!-- LISTA DE NOTIFICAÇÕES PENDENTES -->
  <div class="notif-list-scroll max-h-80 overflow-y-auto">
    @if (notificationService.notifications().length === 0) {
      <div class="no-notifications p-4 text-center text-xs text-gray-400 italic">
        Nenhuma notificação pendente
      </div>
    } @else {
      @for (notif of notificationService.notifications(); track notif.idNotificacao) {
        <button mat-menu-item (click)="lerNotificacao(notif)" class="notif-item">
          <div class="notif-content-wrapper flex items-start gap-3 py-1">
            <mat-icon class="notif-type-icon text-green-400">
              {{ getIconeNotificacao(notif.tipoEntidade) }}
            </mat-icon>

            <div class="flex flex-col text-left leading-tight">
              <span class="notif-titulo font-bold text-xs text-white">
                {{ notif.titulo || notif.tipoNotificacao }}
              </span>
              <span class="notif-mensagem text-xs text-gray-300 truncate max-w-[220px]">
                {{ notif.mensagem }}
              </span>
              <span class="notif-data text-[10px] text-gray-500 mt-1">
                {{ notif.dataCriacao | date:'dd/MM/yyyy HH:mm' }}
              </span>
            </div>
          </div>
        </button>
      }
    }
  </div>
</mat-menu>
